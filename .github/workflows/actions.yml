name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.12', '1.26.5']

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Update dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test with Coverage
        run: |
          # Exclude examples directory from tests and coverage
          go test -race -count=1 $(go list ./... | grep -v /examples/) -coverprofile=coverage.out -covermode=atomic

      - name: Check Coverage
        run: |
          go tool cover -func=coverage.out -o coverage-summary.txt
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total test coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 50" |bc -l) )); then
            echo "Test coverage is below 50%"
            exit 1
          fi
        env:
          GO111MODULE: on

      - name: Upload coverage reports to Codecov
        if: matrix.go-version == '1.26.5'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.out
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Install golangci-lint
        if: matrix.go-version == '1.26.5'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

      - name: FOSSA Scan
        if: matrix.go-version == '1.26.5'
        uses: fossas/fossa-action@v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

